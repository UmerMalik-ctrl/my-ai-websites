<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahil Milk Farm | Rawalpindi's Premium Dairy</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            --emerald: #064e3b;
            --ivory: #FDFBF7;
            --amber: #d97706;
            --text-dark: #1a2e2a;
        }

        body {
            background-color: var(--ivory);
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .serif { font-family: 'Instrument Serif', serif; }

        /* Design Quality Rule: High Contrast Body Text */
        p, .body-text {
            color: var(--text-dark);
            opacity: 0.85; /* Minimum 0.75 as per rules */
            line-height: 1.6;
        }

        /* Mandatory Product Card Zoom Effect */
        .product-card {
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease;
            border: 1px solid rgba(6, 78, 59, 0.1);
        }
        .product-card img {
            transition: transform 0.4s ease;
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .product-card:hover img {
            transform: scale(1.08);
        }
        .product-card:hover {
            border-color: var(--amber);
        }

        #hero-canvas {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .cart-drawer {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .badge-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 1rem;
        }

        .reveal { opacity: 0; transform: translateY(30px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [deliveryStatus, setDeliveryStatus] = useState("");

            const products = [
                {
                    id: 1,
                    name: "Traditional Desi Ghee",
                    label: "BILONA METHOD · PURE",
                    price: 3950,
                    unit: "1KG",
                    desc: "Slow-cooked granular ghee from curd-churned butter.",
                    img: "https://images.unsplash.com/photo-1589927986089-35812388d1f4?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 2,
                    name: "Fresh White Makhan",
                    label: "UNSALTED · FARM FRESH",
                    price: 1100,
                    unit: "500G",
                    desc: "Hand-churned unsalted white butter, rich in probiotics.",
                    img: "https://images.unsplash.com/photo-1589924691106-073b697596cd?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 3,
                    name: "Artisanal Mozzarella",
                    label: "HAND-STRETCHED · CREAMY",
                    price: 1450,
                    unit: "500G",
                    desc: "Perfect melt-and-stretch mozzarella for home pizzas.",
                    img: "https://images.unsplash.com/photo-1559561853-08451507cbe7?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 4,
                    name: "Aged Cheddar Block",
                    label: "SHARP · NATURAL",
                    price: 1850,
                    unit: "500G",
                    desc: "Naturally aged cheddar with a bold, sharp flavor profile.",
                    img: "https://images.unsplash.com/photo-1618164435735-413d3b066c9a?auto=format&fit=crop&q=80&w=800"
                }
            ];

            const areas = ["Bahria Town", "DHA Rawalpindi", "Gulraiz", "Westridge", "Saddar", "Satellite Town"];

            useEffect(() => {
                // Initialize GSAP
                gsap.registerPlugin(ScrollTrigger);
                gsap.to(".reveal", {
                    opacity: 1,
                    y: 0,
                    duration: 1,
                    stagger: 0.2,
                    ease: "power3.out",
                    scrollTrigger: {
                        trigger: ".reveal",
                        start: "top 85%"
                    }
                });

                // Initialize Three.js Hero Accent
                try {
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                    const container = document.getElementById('hero-canvas');
                    
                    if (container) {
                        renderer.setSize(container.offsetWidth, container.offsetHeight);
                        container.appendChild(renderer.domElement);

                        const geometry = new THREE.OctahedronGeometry(2, 0);
                        const material = new THREE.MeshBasicMaterial({ color: 0x064e3b, wireframe: true, transparent: true, opacity: 0.2 });
                        const mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);

                        camera.position.z = 5;

                        const animate = () => {
                            requestAnimationFrame(animate);
                            mesh.rotation.x += 0.005;
                            mesh.rotation.y += 0.005;
                            renderer.render(scene, camera);
                        };
                        animate();
                    }
                } catch(e) { console.error("Three.js load error", e); }
            }, []);

            const addToCart = (product) => {
                setCart([...cart, product]);
                setIsCartOpen(true);
            };

            return (
                <div className="min-h-screen">
                    {/* Sticky Navigation */}
                    <nav className="fixed top-0 w-full z-50 bg-ivory/80 backdrop-blur-md border-b border-emerald/5 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="serif text-2xl font-bold text-emerald italic">Ahil Milk Farm</span>
                        </div>
                        <div className="hidden md:flex gap-8 font-bold text-xs uppercase tracking-widest text-emerald">
                            <a href="#" className="hover:text-amber transition-colors">Home</a>
                            <a href="#store" className="hover:text-amber transition-colors">Products</a>
                            <a href="#delivery" className="hover:text-amber transition-colors">Delivery</a>
                        </div>
                        <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-emerald">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.62H7.64"/></svg>
                            {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-amber text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">{cart.length}</span>}
                        </button>
                    </nav>

                    {/* Hero Section */}
                    <header className="relative h-screen flex items-center pt-20 px-6">
                        <div id="hero-canvas"></div>
                        <div className="container mx-auto relative z-10">
                            <div className="max-w-3xl">
                                <span className="text-amber font-black tracking-[0.3em] uppercase text-xs mb-4 block reveal">Rawalpindi's Finest</span>
                                <h1 className="serif text-6xl md:text-8xl leading-tight text-emerald mb-8 reveal">Pure Purity,<br/><span className="italic text-amber">Directly from Farm.</span></h1>
                                <p className="text-xl mb-10 max-w-xl reveal">Unadulterated fresh milk and premium dairy essentials produced with traditional care and modern hygiene.</p>
                                <div className="flex gap-4 reveal">
                                    <a href="#store" className="bg-emerald text-ivory px-10 py-5 rounded-full font-bold uppercase text-xs tracking-widest hover:bg-amber transition-all shadow-xl shadow-emerald/20">Shop Our Store</a>
                                    <a href="#delivery" className="border-2 border-emerald text-emerald px-10 py-5 rounded-full font-bold uppercase text-xs tracking-widest hover:bg-emerald hover:text-ivory transition-all">Check Area</a>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Quality Highlights */}
                    <section className="py-32 bg-emerald text-ivory px-6">
                        <div className="container mx-auto grid md:grid-cols-3 gap-16">
                            <div className="reveal">
                                <div className="badge-icon">✓</div>
                                <h3 className="serif text-3xl mb-4 text-ivory">Hygienic Milking</h3>
                                <p className="text-ivory/80">Produced under strict quality controls with zero human touch during the milking process.</p>
                            </div>
                            <div className="reveal">
                                <div className="badge-icon">✦</div>
                                <h3 className="serif text-3xl mb-4 text-ivory">Traditional Ghee</h3>
                                <p className="text-ivory/80">Made using traditional slow-cooking methods for authentic granular texture and rich aroma.</p>
                            </div>
                            <div className="reveal">
                                <div className="badge-icon">☘</div>
                                <h3 className="serif text-3xl mb-4 text-ivory">Fresh Delivery</h3>
                                <p className="text-ivory/80">Delivered daily in Rawalpindi within hours of production to maintain maximum nutrient density.</p>
                            </div>
                        </div>
                    </section>

                    {/* Product Store */}
                    <section id="store" className="py-32 px-6">
                        <div className="container mx-auto">
                            <div className="text-center mb-20">
                                <h2 className="serif text-5xl md:text-7xl text-emerald mb-4 reveal">Premium Selection</h2>
                                <p className="reveal">Farm fresh dairy essentials for your family.</p>
                            </div>
                            
                            <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {products.map(p => (
                                    <div key={p.id} className="product-card bg-white rounded-2xl p-4 flex flex-col reveal">
                                        <div className="rounded-xl overflow-hidden mb-6">
                                            <img src={p.img} alt={p.name} />
                                        </div>
                                        <span className="text-[10px] font-black tracking-widest text-amber uppercase mb-2">{p.label}</span>
                                        <h3 className="font-bold text-xl text-emerald mb-2">{p.name}</h3>
                                        <p className="text-xs mb-6 flex-grow">{p.desc}</p>
                                        <div className="flex items-center justify-between mt-4">
                                            <div className="font-black text-emerald">Rs. {p.price} <span className="text-[10px] opacity-50">/ {p.unit}</span></div>
                                            <button 
                                                onClick={() => addToCart(p)}
                                                className="bg-emerald text-ivory px-4 py-2 rounded-lg text-xs font-bold hover:bg-amber transition-colors"
                                            >
                                                Add to Cart
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Delivery Area Check */}
                    <section id="delivery" className="py-32 bg-ivory border-y border-emerald/5 px-6">
                        <div className="container mx-auto max-w-4xl text-center">
                            <h2 className="serif text-4xl text-emerald mb-8 reveal">Rawalpindi Delivery Check</h2>
                            <div className="flex flex-col md:flex-row gap-4 justify-center reveal">
                                <select 
                                    className="px-8 py-4 rounded-full border-2 border-emerald/10 outline-none focus:border-amber bg-transparent font-bold text-emerald"
                                    onChange={(e) => setDeliveryStatus(e.target.value ? `✅ Delivery available in ${e.target.value}` : "")}
                                >
                                    <option value="">Select your area...</option>
                                    {areas.map(a => <option key={a} value={a}>{a}</option>)}
                                </select>
                            </div>
                            {deliveryStatus && <p className="mt-6 text-emerald font-black animate-pulse">{deliveryStatus}</p>}
                        </div>
                    </section>

                    {/* Testimonials */}
                    <section className="py-32 px-6">
                        <div className="container mx-auto">
                            <h2 className="serif text-5xl text-center text-emerald mb-20 reveal">Trust of Families</h2>
                            <div className="grid md:grid-cols-2 gap-12">
                                <div className="reveal p-10 bg-emerald/5 rounded-3xl border-l-4 border-amber">
                                    <p className="serif text-2xl italic mb-6">"Ahil Farm milk is the closest to the freshness I remember from my village days. The Desi Ghee aroma is pure nostalgia."</p>
                                    <p className="font-bold uppercase tracking-widest text-xs text-emerald">— Omar K., Bahria Phase 7</p>
                                </div>
                                <div className="reveal p-10 bg-emerald/5 rounded-3xl border-l-4 border-amber">
                                    <p className="serif text-2xl italic mb-6">"The only place in Rawalpindi I trust for fresh Mozzarella. My home pizzas have leveled up significantly."</p>
                                    <p className="font-bold uppercase tracking-widest text-xs text-emerald">— Dr. Sara J., DHA-1</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Cart Drawer */}
                    {isCartOpen && <div className="fixed inset-0 bg-emerald/40 backdrop-blur-sm z-[99]" onClick={() => setIsCartOpen(false)}></div>}
                    <div className={`cart-drawer fixed top-0 right-0 h-full w-full max-w-md bg-white p-10 flex flex-col transform ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex justify-between items-center mb-10">
                            <h2 className="serif text-4xl text-emerald">Your Basket</h2>
                            <button onClick={() => setIsCartOpen(false)} className="text-emerald">✕</button>
                        </div>
                        <div className="flex-grow overflow-y-auto">
                            {cart.length === 0 ? (
                                <p className="opacity-50 italic">Your cart is empty.</p>
                            ) : (
                                cart.map((item, idx) => (
                                    <div key={idx} className="flex justify-between items-center mb-6 pb-6 border-b border-emerald/5">
                                        <div>
                                            <p className="font-bold text-emerald">{item.name}</p>
                                            <p className="text-xs opacity-50">Rs. {item.price}</p>
                                        </div>
                                        <button onClick={() => setCart(cart.filter((_, i) => i !== idx))} className="text-xs text-red-500 font-bold">Remove</button>
                                    </div>
                                ))
                            )}
                        </div>
                        <div className="pt-8 border-t border-emerald/10">
                            <div className="flex justify-between font-black text-xl text-emerald mb-8">
                                <span>Total</span>
                                <span>Rs. {cart.reduce((sum, item) => sum + item.price, 0)}</span>
                            </div>
                            <button className="w-full bg-amber text-white py-5 rounded-full font-bold uppercase tracking-widest text-xs">Proceed to Checkout</button>
                        </div>
                    </div>

                    <footer className="py-20 bg-ivory border-t border-emerald/10 px-6">
                        <div className="container mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="serif text-3xl font-bold text-emerald italic">Ahil Milk Farm</div>
                            <p className="text-xs font-bold uppercase tracking-widest text-emerald/40">Rawalpindi, Pakistan • Farm Direct</p>
                            <div className="flex gap-6 font-bold text-xs uppercase tracking-widest text-emerald">
                                <a href="#">Instagram</a>
                                <a href="#">WhatsApp</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Transpiler for Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
