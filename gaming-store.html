<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahil Milk Farm | Purest Dairy in Rawalpindi</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        :root {
            --emerald: #064e3b;
            --ivory: #FDFBF7;
            --amber: #d97706;
            --text-main: #1a2e2a;
        }

        body {
            background-color: var(--ivory);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .serif { font-family: 'Instrument Serif', serif; }

        /* GSAP Reveal Start States */
        .reveal { opacity: 0; transform: translateY(30px); }

        #hero-canvas {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .product-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(6, 78, 59, 0.1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(6, 78, 59, 0.08);
            border-color: var(--amber);
        }

        .cart-drawer {
            transition: transform 0.5s cubic-bezier(0.85, 0, 0.15, 1);
            z-index: 100;
        }

        .cart-overlay {
            background: rgba(6, 78, 59, 0.4);
            backdrop-filter: blur(4px);
            z-index: 90;
        }

        .sticky-nav {
            backdrop-filter: blur(12px);
            background: rgba(253, 251, 247, 0.8);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [deliveryStatus, setDeliveryStatus] = useState("");
            const [quantities, setQuantities] = useState({ 1: 1, 2: 1 });

            const products = [
                {
                    id: 1,
                    name: "Ahil Pure Whole Milk",
                    price: 240,
                    unit: "Litre",
                    desc: "Fresh morning milk, chilled and delivered within 4 hours of milking.",
                    img: "https://images.unsplash.com/photo-1550583724-1255818c0533?auto=format&fit=crop&q=80&w=800"
                },
                {
                    id: 2,
                    name: "Ahil Premium Desi Ghee",
                    price: 3800,
                    unit: "1KG Jar",
                    desc: "Slow-cooked using traditional Bilona methods for granular texture.",
                    img: "https://images.unsplash.com/photo-1589927986089-35812388d1f4?auto=format&fit=crop&q=80&w=800"
                }
            ];

            const areas = ["Bahria Town (Phase 1-8)", "DHA (Phase 1-5)", "Saddar", "Satellite Town", "Gulraiz", "Westridge", "Media Town"];

            useEffect(() => {
                // Initialize Three.js Hero
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                const container = document.getElementById('hero-canvas');
                
                if (container) {
                    renderer.setSize(container.offsetWidth, container.offsetHeight);
                    container.appendChild(renderer.domElement);

                    const geometry = new THREE.IcosahedronGeometry(2, 1);
                    const material = new THREE.MeshBasicMaterial({ color: 0x064e3b, wireframe: true, transparent: true, opacity: 0.2 });
                    const shape = new THREE.Mesh(geometry, material);
                    scene.add(shape);

                    camera.position.z = 5;

                    const animate = () => {
                        requestAnimationFrame(animate);
                        shape.rotation.x += 0.001;
                        shape.rotation.y += 0.001;
                        renderer.render(scene, camera);
                    };
                    animate();
                }

                // GSAP Animations
                gsap.registerPlugin(ScrollTrigger);
                gsap.to(".reveal", {
                    opacity: 1,
                    y: 0,
                    duration: 1,
                    stagger: 0.2,
                    ease: "power3.out",
                    scrollTrigger: {
                        trigger: ".reveal",
                        start: "top 85%"
                    }
                });
            }, []);

            const addToCart = (product) => {
                const qty = quantities[product.id];
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + qty } : item));
                } else {
                    setCart([...cart, { ...product, qty }]);
                }
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="sticky-nav fixed top-0 w-full z-50 border-b border-emerald/5 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-emerald rounded-full flex items-center justify-center text-white font-bold">A</div>
                            <span className="text-xl font-extrabold tracking-tighter text-emerald uppercase">Ahil Milk Farm</span>
                        </div>
                        <div className="hidden md:flex gap-8 font-medium text-sm uppercase tracking-widest text-emerald">
                            <a href="#" className="hover:text-amber transition-colors">Home</a>
                            <a href="#store" className="hover:text-amber transition-colors">Our Store</a>
                            <a href="#about" className="hover:text-amber transition-colors">Purity</a>
                        </div>
                        <button onClick={() => setIsCartOpen(true)} className="relative p-2 bg-emerald text-white rounded-full hover:bg-emerald/90 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.62H7.64"/></svg>
                            {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-amber text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-ivory">{cart.length}</span>}
                        </button>
                    </nav>

                    {/* Hero */}
                    <section className="relative h-[90vh] flex items-center pt-20 overflow-hidden px-6">
                        <div id="hero-canvas"></div>
                        <div className="container mx-auto relative z-10">
                            <div className="max-w-3xl">
                                <h1 className="serif text-6xl md:text-8xl mb-6 leading-[0.9] text-emerald reveal">Pure Freshness <br/><span className="text-amber italic">Directly from Farm</span></h1>
                                <p className="text-lg md:text-xl text-emerald/80 mb-8 max-w-xl reveal" style={{opacity: 0.85}}>
                                    100% natural, unadulterated dairy delivered to your doorstep in Rawalpindi. We ensure hygiene from milking to delivery.
                                </p>
                                <div className="flex gap-4 reveal">
                                    <a href="#store" className="bg-amber text-white px-8 py-4 rounded-full font-bold hover:scale-105 transition-transform shadow-lg shadow-amber/20">Shop Our Products</a>
                                    <button className="border border-emerald text-emerald px-8 py-4 rounded-full font-bold hover:bg-emerald hover:text-white transition-all">Our Story</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Quality Highlights */}
                    <section id="about" className="py-24 bg-emerald text-ivory px-6">
                        <div className="container mx-auto grid md:grid-cols-3 gap-12">
                            <div className="reveal">
                                <h3 className="serif text-4xl mb-4 text-amber">100% Pure & Organic</h3>
                                <p className="opacity-90 leading-relaxed" style={{opacity: 0.9}}>Strict zero-adulteration policy. No preservatives, chemicals, or hormones added. Just as nature intended.</p>
                            </div>
                            <div className="reveal">
                                <h3 className="serif text-4xl mb-4 text-amber">Hygienic Milking</h3>
                                <p className="opacity-90 leading-relaxed" style={{opacity: 0.9}}>Our cattle are monitored by vets daily. Milking is done using automated systems with zero human touch.</p>
                            </div>
                            <div className="reveal">
                                <h3 className="serif text-4xl mb-4 text-amber">Desi Ghee Bilona</h3>
                                <p className="opacity-90 leading-relaxed" style={{opacity: 0.9}}>Traditional slow-cooking over 12 hours gives our Desi Ghee its authentic granular texture and golden aroma.</p>
                            </div>
                        </div>
                    </section>

                    {/* Store Section */}
                    <section id="store" className="py-24 px-6 bg-white">
                        <div className="container mx-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-16">
                                <div>
                                    <h2 className="serif text-5xl md:text-7xl text-emerald mb-4 reveal">Rawalpindi's Finest</h2>
                                    <p className="text-emerald/60 reveal" style={{opacity: 0.8}}>One-time purchases with same-day delivery.</p>
                                </div>
                                <div className="mt-8 md:mt-0 w-full md:w-auto reveal">
                                    <label className="block text-xs font-bold uppercase tracking-widest text-emerald/40 mb-2">Check Delivery Area</label>
                                    <select 
                                        onChange={(e) => setDeliveryStatus(e.target.value ? `✅ Delivery available in ${e.target.value}` : "")}
                                        className="w-full md:w-64 border-b-2 border-emerald/20 py-2 focus:border-amber outline-none bg-transparent font-bold text-emerald"
                                    >
                                        <option value="">Select your area...</option>
                                        {areas.map(a => <option key={a} value={a}>{a}</option>)}
                                    </select>
                                    {deliveryStatus && <p className="text-xs mt-2 text-emerald font-bold">{deliveryStatus}</p>}
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-8">
                                {products.map(p => (
                                    <div key={p.id} className="product-card bg-ivory rounded-2xl overflow-hidden flex flex-col md:flex-row reveal">
                                        <div className="md:w-1/2 h-64 md:h-auto overflow-hidden">
                                            <img src={p.img} alt={p.name} className="w-full h-full object-cover hover:scale-110 transition-transform duration-700" />
                                        </div>
                                        <div className="p-8 md:w-1/2 flex flex-col justify-between">
                                            <div>
                                                <span className="text-amber font-bold text-xs tracking-widest uppercase">Direct from Farm</span>
                                                <h3 className="serif text-3xl text-emerald my-2">{p.name}</h3>
                                                <p className="text-sm text-emerald/70 mb-6" style={{opacity: 0.85}}>{p.desc}</p>
                                                <div className="text-2xl font-bold text-emerald mb-6">Rs. {p.price} <span className="text-sm font-normal text-emerald/40">/ {p.unit}</span></div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="flex items-center border border-emerald/20 rounded-full px-4 py-2">
                                                    <button onClick={() => setQuantities({...quantities, [p.id]: Math.max(1, quantities[p.id]-1)})} className="text-emerald font-bold">-</button>
                                                    <span className="mx-4 font-bold min-w-[20px] text-center">{quantities[p.id]}</span>
                                                    <button onClick={() => setQuantities({...quantities, [p.id]: quantities[p.id]+1})} className="text-emerald font-bold">+</button>
                                                </div>
                                                <button 
                                                    onClick={() => addToCart(p)}
                                                    className="flex-1 bg-emerald text-white font-bold py-3 rounded-full hover:bg-amber transition-colors"
                                                >
                                                    Add to Cart
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Cart Drawer */}
                    {isCartOpen && <div className="cart-overlay fixed inset-0" onClick={() => setIsCartOpen(false)}></div>}
                    <div className={`cart-drawer fixed top-0 right-0 h-full w-full md:w-[450px] bg-white shadow-2xl p-8 flex flex-col transform ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="serif text-4xl text-emerald">Your Basket</h2>
                            <button onClick={() => setIsCartOpen(false)} className="text-emerald">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {cart.length === 0 ? (
                                <div className="text-center py-20 text-emerald/40 font-bold uppercase tracking-widest text-sm">Your cart is empty</div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex gap-4 mb-6 pb-6 border-b border-emerald/5">
                                        <div className="w-20 h-20 bg-ivory rounded-lg overflow-hidden shrink-0">
                                            <img src={item.img} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex justify-between font-bold text-emerald">
                                                <span>{item.name}</span>
                                                <button onClick={() => removeFromCart(item.id)} className="text-red-500 text-xs">Remove</button>
                                            </div>
                                            <div className="text-sm text-emerald/60 mt-1">{item.qty} x Rs. {item.price}</div>
                                            <div className="text-amber font-bold mt-2">Rs. {item.qty * item.price}</div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="mt-auto border-t-2 border-emerald/10 pt-8">
                            <div className="flex justify-between text-2xl font-bold text-emerald mb-6">
                                <span>Total</span>
                                <span>Rs. {subtotal}</span>
                            </div>
                            <button 
                                className="w-full bg-amber text-white font-bold py-5 rounded-full text-lg shadow-xl shadow-amber/20 disabled:opacity-50"
                                disabled={cart.length === 0}
                                onClick={() => alert("Proceeding to secure checkout for Rawalpindi delivery...")}
                            >
                                Proceed to Checkout
                            </button>
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-ivory border-t border-emerald/5 py-20 px-6">
                        <div className="container mx-auto grid md:grid-cols-4 gap-12">
                            <div className="col-span-2">
                                <div className="flex items-center gap-2 mb-6">
                                    <div className="w-10 h-10 bg-emerald rounded-full flex items-center justify-center text-white font-bold">A</div>
                                    <span className="text-xl font-extrabold tracking-tighter text-emerald uppercase">Ahil Milk Farm</span>
                                </div>
                                <p className="text-emerald/70 max-w-sm mb-8" style={{opacity: 0.8}}>Purity you can trust. Farm-fresh milk and Desi Ghee produced under strict international quality standards in Rawalpindi.</p>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 border border-emerald/20 rounded-full flex items-center justify-center hover:bg-emerald hover:text-white transition-all cursor-pointer">FB</div>
                                    <div className="w-10 h-10 border border-emerald/20 rounded-full flex items-center justify-center hover:bg-emerald hover:text-white transition-all cursor-pointer">IG</div>
                                </div>
                            </div>
                            <div>
                                <h4 className="font-bold text-emerald mb-6 uppercase tracking-widest text-xs">Location</h4>
                                <p className="text-sm text-emerald/70" style={{opacity: 0.85}}>Rawalpindi, Pakistan<br/>Main Adyala Road, Farm Sector<br/>+92 300 0000000</p>
                            </div>
                            <div>
                                <h4 className="font-bold text-emerald mb-6 uppercase tracking-widest text-xs">Newsletter</h4>
                                <input type="email" placeholder="Email Address" className="bg-white border-b border-emerald/20 w-full py-2 outline-none focus:border-amber mb-4" />
                                <button className="text-amber font-bold text-sm uppercase tracking-widest">Subscribe</button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Transpiler for Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
